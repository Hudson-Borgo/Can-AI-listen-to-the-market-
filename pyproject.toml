[project]
name = "can-ai-listen-to-the-market"
version = "0.1.0"
description = "POC para monitoramento de notícias e geração de sinal de mercado de energia."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "matplotlib>=3.11.1",
    "nbformat>=5.11.1",
    "openai>=3.3.1",
    "pandas>=3.0.5",
    "pathlib>=1.0.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
]
